services:
  - type: web
    name: procraft-studio
    env: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm --prefix client install --legacy-peer-deps && npm --prefix server install --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
      - key: NODE_OPTIONS
        value: "--max-old-space-size=4096"
      - key: NPM_CONFIG_LEGACY_PEER_DEPS
        value: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        value: "" # Optional: Add your MongoDB Atlas connection string here, or leave blank to use the auto memory DB fallback
