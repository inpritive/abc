services:
  - type: web
    name: procraft-studio
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        value: "" # Optional: Add your MongoDB Atlas connection string here, or leave blank to use the auto memory DB fallback
