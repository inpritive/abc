version: '3.8'

services:
  mongodb-prod:
    image: mongo:6.0
    container_name: procraft-mongo-prod
    restart: always
    volumes:
      - mongo-prod-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: procraft
    networks:
      - procraft-net

  procraft-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: procraft-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb-prod:27017/procraft
      - MONGODB_URI=mongodb://mongodb-prod:27017/procraft
      - JWT_SECRET=procraft_super_secret_jwt_key_2026_prod
    depends_on:
      - mongodb-prod
    networks:
      - procraft-net

volumes:
  mongo-prod-data:

networks:
  procraft-net:
    driver: bridge
